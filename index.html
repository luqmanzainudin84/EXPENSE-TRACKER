<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anak Luqman Expense Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .home-btn {
            text-decoration: none;
            background-color: #ffffff;
            color: #333;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 30px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #4b4b4b;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #e1e1e1;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #f9f9f9;
        }

        /* Mewarnakan label kumpulan dalam dropdown */
        optgroup {
            font-style: normal;
            font-weight: bold;
            background-color: #eee;
        }

        button#submitBtn {
            width: 100%;
            padding: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button#submitBtn:hover { background-color: #219150; }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
        }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <a href="https://luqmanzainudin84.github.io/LUQMAN/" class="home-btn">🏠 HOME</a>

    <div class="container">
        <h2>💰 Perbelanjaan</h2>
        <form id="expenseForm">
            <div class="form-group">
                <label>📅 Tarikh Transaksi</label>
                <input type="date" id="tarikh" required>
            </div>

            <div class="form-group">
                <label>📝 Nama Barang / Perkara</label>
                <input type="text" id="perkara" placeholder="Contoh: Nasi Kandar" required>
            </div>

            <div class="form-group">
                <label>📂 Kategori</label>
                <select id="kategori" required>
                    <option value="">Memuatkan senarai...</option>
                </select>
            </div>

            <div class="form-group">
                <label>💵 Jumlah (RM)</label>
                <input type="number" step="0.01" id="jumlah" placeholder="0.00" required>
            </div>

            <button type="submit" id="submitBtn">Simpan Rekod</button>
        </form>
        <div id="status"></div>
    </div>

<script>
    // GANTIKAN DENGAN URL WEB APP ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxySlGFp9EYZKHsq_1FnoE17ubTRbhrBTmaFgyWgRCsQtdrApyX8ppAMJ91whqQJ8MF/exec";

    window.onload = function() {
        document.getElementById('tarikh').valueAsDate = new Date();

        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('kategori');
                select.innerHTML = '<option value="">-- Pilih Kategori --</option>';

                let currentGroup = "";
                let groupElement = null;

                data.forEach(item => {
                    // Jika kumpulan bertukar, buat optgroup baru
                    if (item.kumpulan !== currentGroup) {
                        groupElement = document.createElement('optgroup');
                        groupElement.label = item.kumpulan.toUpperCase();
                        
                        // Warna Hijau untuk Income, Merah untuk Expense
                        groupElement.style.color = (item.jenis === "Income") ? "#27ae60" : "#e74c3c";
                        
                        select.appendChild(groupElement);
                        currentGroup = item.kumpulan;
                    }

                    // Tambah sub-kategori ke dalam optgroup dengan Indentation
                    let opt = document.createElement('option');
                    opt.value = item.kategori;
                    opt.innerHTML = "&nbsp;&nbsp;&raquo; " + item.kategori; // Simbol indent
                    opt.style.color = "#333"; // Teks sub-kategori tetap hitam
                    groupElement.appendChild(opt);
                });
            })
            .catch(err => {
                document.getElementById('status').innerHTML = "Gagal memuatkan kategori.";
            });
    };

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        status.innerHTML = "Menyimpan...";

        const payload = {
            tarikh: document.getElementById('tarikh').value,
            perkara: document.getElementById('perkara').value,
            kategori: document.getElementById('kategori').value,
            jumlah: document.getElementById('jumlah').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.text())
        .then(res => {
            status.innerHTML = "✅ Berjaya!";
            status.className = "success";
            document.getElementById('expenseForm').reset();
            document.getElementById('tarikh').valueAsDate = new Date();
            btn.disabled = false;
        })
        .catch(err => {
            status.innerHTML = "❌ Ralat!";
            status.className = "error";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
