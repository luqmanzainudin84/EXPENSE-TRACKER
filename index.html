<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Kewangan Pro - Versi Tahun</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2ecc71; --secondary: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2, h3 { color: #2c3e50; text-align: center; margin-top: 0; }
        
        input, select, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #dfe6e9; font-size: 16px; box-sizing: border-box; }
        
        /* Dropdown Warna */
        select { background-color: white !important; color: #2c3e50 !important; appearance: auto; }
        optgroup { font-weight: bold; color: #2980b9; }

        button { background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer; }
        button:disabled { background: #bdc3c7; }

        .filter-box { background: #fff; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 2px solid var(--secondary); }
        .summary-text { text-align: center; font-weight: bold; font-size: 18px; color: #e74c3c; margin-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; font-size: 13px; }
        th { background: #f8f9fa; padding: 12px; text-align: left; color: #7f8c8d; }
        td { padding: 12px; border-bottom: 1px solid #f1f2f6; }
        .amt-pos { color: #27ae60; font-weight: bold; }
        .amt-neg { color: #e74c3c; font-weight: bold; }
        
        #loading { text-align: center; color: var(--secondary); font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>💰 My Tracker</h2>
        <div id="loading">Memproses data...</div>
        <form id="expForm">
            <input type="date" id="tgl" required>
            <input type="text" id="item" placeholder="Perkara" required>
            <select id="kat" required><option value="">-- Pilih Kategori --</option></select>
            <input type="number" step="0.01" id="amt" placeholder="RM 0.00" required>
            <button type="submit" id="btnSubmit">SIMPAN</button>
        </form>
    </div>

    <div class="filter-box">
        <label style="font-weight:bold; color:var(--secondary)">Pilih Bulan & Tahun:</label>
        <select id="periodFilter" onchange="filterByPeriod()">
            </select>
    </div>

    <div class="card">
        <div id="summary" class="summary-text">RM 0.00</div>
        <canvas id="myChart"></canvas>
    </div>

    <div class="card" style="padding: 10px;">
        <h3>📜 Rekod Transaksi</h3>
        <table id="logTable">
            <thead><tr><th>Tarikh</th><th>Perkara</th><th>RM</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxgEsty2dUK21KOUqm_fQa9U8VuCwEpd6r50i-s667vtN6ZrctpF24oSAMmAGbSXOD0EQ/exec";
    let allLogs = [];
    let myPieChart;

    window.onload = () => {
        document.getElementById('tgl').valueAsDate = new Date();
        ambilData();
    };

    function ambilData() {
        document.getElementById('loading').style.display = 'block';
        fetch(WEB_APP_URL).then(res => res.json()).then(data => {
            // 1. Dropdown Kategori
            const select = document.getElementById('kat');
            select.innerHTML = '<option value="">-- Pilih Kategori --</option>';
            const gps = data.categories.reduce((acc, obj) => {
                const key = obj.kumpulan;
                if (!acc[key]) acc[key] = [];
                acc[key].push(obj.kategori);
                return acc;
            }, {});
            for (let grp in gps) {
                let groupTag = document.createElement('optgroup');
                groupTag.label = grp;
                gps[grp].forEach(k => {
                    let opt = document.createElement('option');
                    opt.value = k; opt.text = k;
                    groupTag.appendChild(opt);
                });
                select.add(groupTag);
            }

            // 2. Simpan Logs & Bina Filter Tahun-Bulan
            allLogs = data.logs;
            binaFilterPeriod(allLogs);
            document.getElementById('loading').style.display = 'none';
        });
    }

    function binaFilterPeriod(logs) {
        const filter = document.getElementById('periodFilter');
        const periods = new Set();
        
        // Ambil setiap Bulan-Tahun yang unik dari data
        logs.forEach(log => {
            const d = new Date(log.tarikh);
            const label = d.toLocaleDateString('ms-MY', { month: 'long', year: 'numeric' });
            const val = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
            periods.add(JSON.stringify({val, label}));
        });

        const sortedPeriods = Array.from(periods).map(p => JSON.parse(p)).sort((a,b) => b.val.localeCompare(a.val));
        
        filter.innerHTML = '';
        sortedPeriods.forEach(p => {
            filter.innerHTML += `<option value="${p.val}">${p.label}</option>`;
        });

        filterByPeriod();
    }

    function filterByPeriod() {
        const selected = document.getElementById('periodFilter').value;
        const filtered = allLogs.filter(log => {
            return log.tarikh.startsWith(selected);
        });
        kemaskiniUI(filtered);
    }

    function kemaskiniUI(logs) {
        const tbody = document.querySelector('#logTable tbody');
        tbody.innerHTML = '';
        const chartData = {};
        let totalBelanja = 0;

        logs.forEach(log => {
            const row = tbody.insertRow();
            const dt = new Date(log.tarikh).toLocaleDateString('ms-MY', {day:'2-digit', month:'2-digit'});
            const cls = log.jumlah < 0 ? 'amt-neg' : 'amt-pos';
            row.innerHTML = `<td>${dt}</td><td>${log.perkara}</td><td class="${cls}">${log.jumlah.toFixed(2)}</td>`;

            if (log.jumlah < 0) {
                chartData[log.kategori] = (chartData[log.kategori] || 0) + Math.abs(log.jumlah);
                totalBelanja += Math.abs(log.jumlah);
            }
        });

        document.getElementById('summary').innerText = `Total Belanja: RM ${totalBelanja.toFixed(2)}`;
        lukisCarta(chartData);
    }

    function lukisCarta(data) {
        const ctx = document.getElementById('myChart').getContext('2d');
        if (myPieChart) myPieChart.destroy();
        if (Object.keys(data).length === 0) return;

        myPieChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: Object.keys(data),
                datasets: [{
                    data: Object.values(data),
                    backgroundColor: ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c']
                }]
            }
        });
    }

    document.getElementById('expForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "SIMPAN...";

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({
                tarikh: document.getElementById('tgl').value,
                perkara: document.getElementById('item').value,
                kategori: document.getElementById('kat').value,
                jumlah: document.getElementById('amt').value
            })
        }).then(() => {
            document.getElementById('expForm').reset();
            document.getElementById('tgl').valueAsDate = new Date();
            btn.disabled = false;
            btn.innerText = "SIMPAN";
            ambilData();
        });
    };
</script>
</body>
</html>
