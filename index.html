<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Kewangan Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2ecc71; --secondary: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2, h3 { color: #2c3e50; text-align: center; margin-top: 0; }
        
        input, select, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #dfe6e9; font-size: 16px; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1); }
        
        button { background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: #27ae60; transform: translateY(-2px); }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }

        /* Style Kategori */
        optgroup { font-weight: bold; color: #7f8c8d; background: #f1f2f6; }
        option { color: #2c3e50; background: white; }

        .chart-box { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .log-section { width: 100%; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        th { background: #ecf0f1; padding: 12px; text-align: left; color: #7f8c8d; }
        td { padding: 12px; border-bottom: 1px solid #f1f2f6; }
        .amt-pos { color: #27ae60; font-weight: bold; }
        .amt-neg { color: #e74c3c; font-weight: bold; }
        
        #loading { text-align: center; color: var(--secondary); font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>💰 My Tracker</h2>
        <div id="loading">Sila tunggu...</div>
        <form id="expForm">
            <input type="date" id="tgl" required>
            <input type="text" id="item" placeholder="Contoh: Beli Barang Dapur" required>
            <select id="kat" required>
                <option value="">-- Memuatkan Kategori --</option>
            </select>
            <input type="number" step="0.01" id="amt" placeholder="RM 0.00" required>
            <button type="submit" id="btnSubmit">SIMPAN TRANSAKSI</button>
        </form>
    </div>

    <div class="chart-box">
        <h3>📊 Analisis Belanja (%)</h3>
        <canvas id="myChart"></canvas>
    </div>

    <div class="log-section">
        <h3>📜 10 Rekod Terkini</h3>
        <table id="logTable">
            <thead>
                <tr>
                    <th>Tarikh</th>
                    <th>Perkara</th>
                    <th>RM</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP BARU PUAN DI SINI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxgEsty2dUK21KOUqm_fQa9U8VuCwEpd6r50i-s667vtN6ZrctpF24oSAMmAGbSXOD0EQ/exec";
    let myPieChart;

    window.onload = () => {
        document.getElementById('tgl').valueAsDate = new Date();
        ambilData();
    };

    function ambilData() {
        document.getElementById('loading').style.display = 'block';
        fetch(WEB_APP_URL)
            .then(res => res.json())
            .then(data => {
                // 1. Kemaskini Dropdown Kategori
                const select = document.getElementById('kat');
                select.innerHTML = '<option value="">-- Pilih Kategori --</option>';
                
                const gps = data.categories.reduce((acc, obj) => {
                    const key = obj.kumpulan;
                    if (!acc[key]) acc[key] = [];
                    acc[key].push(obj.kategori);
                    return acc;
                }, {});

                for (let grp in gps) {
                    let groupTag = document.createElement('optgroup');
                    groupTag.label = grp;
                    gps[grp].forEach(k => {
                        let opt = document.createElement('option');
                        opt.value = k;
                        opt.text = k;
                        groupTag.appendChild(opt);
                    });
                    select.add(groupTag);
                }

                // 2. Kemaskini Log & Carta
                kemaskiniUI(data.logs);
                document.getElementById('loading').style.display = 'none';
            });
    }

    function kemaskiniUI(logs) {
        const tbody = document.querySelector('#logTable tbody');
        tbody.innerHTML = '';
        const chartData = {};

        logs.slice(0, 10).forEach(log => {
            const row = tbody.insertRow();
            const dt = new Date(log.tarikh).toLocaleDateString('ms-MY', {day:'2-digit', month:'2-digit'});
            const cls = log.jumlah < 0 ? 'amt-neg' : 'amt-pos';
            
            row.innerHTML = `<td>${dt}</td><td>${log.perkara}</td><td class="${cls}">${log.jumlah.toFixed(2)}</td>`;

            // Data untuk carta (hanya ambil perbelanjaan sahaja/negatif)
            if (log.jumlah < 0) {
                chartData[log.kategori] = (chartData[log.kategori] || 0) + Math.abs(log.jumlah);
            }
        });

        lukisCarta(chartData);
    }

    function lukisCarta(data) {
        const ctx = document.getElementById('myChart').getContext('2d');
        if (myPieChart) myPieChart.destroy();

        myPieChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: Object.keys(data),
                datasets: [{
                    data: Object.values(data),
                    backgroundColor: ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22']
                }]
            },
            options: {
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                let value = context.raw;
                                let percentage = ((value / total) * 100).toFixed(1) + "%";
                                return context.label + ": RM" + value.toFixed(2) + " (" + percentage + ")";
                            }
                        }
                    }
                }
            }
        });
    }

    document.getElementById('expForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "MENYIMPAN...";

        const payload = {
            tarikh: document.getElementById('tgl').value,
            perkara: document.getElementById('item').value,
            kategori: document.getElementById('kat').value,
            jumlah: document.getElementById('amt').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.text())
        .then(() => {
            document.getElementById('expForm').reset();
            document.getElementById('tgl').valueAsDate = new Date();
            btn.disabled = false;
            btn.innerText = "SIMPAN TRANSAKSI";
            ambilData(); // Refresh data
        });
    };
</script>

</body>
</html>
