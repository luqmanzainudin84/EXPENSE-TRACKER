<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-md mx-auto p-4">
        <header class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">My Finance App</h1>
            <p class="text-sm text-gray-500">Kemas kini automatik dari Google Sheets</p>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-blue-600 p-4 rounded-xl text-white shadow-lg">
                <p class="text-xs opacity-80">Total Gaji</p>
                <h2 id="total-gaji" class="text-xl font-bold">RM 0</h2>
            </div>
            <div class="bg-green-600 p-4 rounded-xl text-white shadow-lg">
                <p class="text-xs opacity-80">Total Simpanan</p>
                <h2 id="total-simpanan" class="text-xl font-bold">RM 0</h2>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow mb-6">
            <h3 class="text-sm font-semibold mb-4 text-gray-700">Agihan Kewangan</h3>
            <canvas id="myChart"></canvas>
        </div>

        <h3 class="text-sm font-semibold mb-3 text-gray-700">Transaksi Terkini</h3>
        <div id="transaction-list" class="space-y-3">
            <p class="text-center text-gray-400">Loading data...</p>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKoViIImo84Y46xFVekhPH5e-_m0gGQ1lXWPbVoQx3VETGKGDjWe7pdTYX-8zmkRIYeUcvfXDgYJVR/pub?output=csv';

        async function fetchData() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // Buang header

                let totalGaji = 0;
                let totalSimpanan = 0;
                let htmlList = '';

                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length < 5) return;

                    const kategori = cols[3].trim();
                    const jumlah = parseFloat(cols[4]);
                    const nama = cols[2];
                    const tarikh = cols[1];

                    if (kategori === 'Gaji') totalGaji += jumlah;
                    if (kategori === 'Simpanan') totalSimpanan += jumlah;

                    // Bina UI untuk list
                    htmlList += `
                        <div class="bg-white p-3 rounded-lg shadow-sm flex justify-between items-center">
                            <div>
                                <p class="font-medium text-gray-800">${nama}</p>
                                <p class="text-xs text-gray-400">${tarikh}</p>
                            </div>
                            <p class="font-bold ${kategori === 'Gaji' ? 'text-blue-600' : 'text-green-600'}">
                                ${kategori === 'Gaji' ? '+' : ''}RM ${jumlah}
                            </p>
                        </div>
                    `;
                });

                document.getElementById('total-gaji').innerText = `RM ${totalGaji}`;
                document.getElementById('total-simpanan').innerText = `RM ${totalSimpanan}`;
                document.getElementById('transaction-list').innerHTML = htmlList;

                // Update Chart
                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Gaji', 'Simpanan'],
                        datasets: [{
                            data: [totalGaji, totalSimpanan],
                            backgroundColor: ['#2563eb', '#16a34a']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });

            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        fetchData();
    </script>
</body>
</html>
