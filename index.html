<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .home-btn { text-decoration: none; background: white; color: #333; padding: 10px 25px; border-radius: 50px; font-weight: 600; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        optgroup { font-style: normal; font-weight: bold; }
        button { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <a href="https://luqmanzainudin84.github.io/LUQMAN/" class="home-btn">🏠 HOME</a>

    <div class="container">
        <h2>💰 Perbelanjaan</h2>
        <form id="expenseForm">
            <div class="form-group">
                <label>📅 Tarikh Transaksi</label>
                <input type="date" id="tarikh" required>
            </div>
            <div class="form-group">
                <label>📝 Nama Barang / Perkara</label>
                <input type="text" id="perkara" placeholder="Contoh: Nasi Kandar" required>
            </div>
            <div class="form-group">
                <label>📂 Kategori</label>
                <select id="kategori" required>
                    <option value="">Memuatkan senarai...</option>
                </select>
            </div>
            <div class="form-group">
                <label>💵 Jumlah (RM)</label>
                <input type="number" step="0.01" id="jumlah" placeholder="0.00" required>
            </div>
            <button type="submit" id="submitBtn">Simpan Rekod</button>
        </form>
        <div id="status"></div>
    </div>

<script>
    // GANTIKAN DENGAN URL BARU SELEPAS NEW DEPLOYMENT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxySlGFp9EYZKHsq_1FnoE17ubTRbhrBTmaFgyWgRCsQtdrApyX8ppAMJ91whqQJ8MF/exec";

    window.onload = function() {
        document.getElementById('tarikh').valueAsDate = new Date();
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('kategori');
                select.innerHTML = '<option value="">-- Pilih Kategori --</option>';
                let currentGroup = "";
                let groupElement = null;

                data.forEach(item => {
                    if (item.kumpulan !== currentGroup) {
                        groupElement = document.createElement('optgroup');
                        groupElement.label = item.kumpulan.toUpperCase();
                        groupElement.style.color = (item.jenis === "Income") ? "#27ae60" : "#e74c3c"; // Warna berbeza
                        select.appendChild(groupElement);
                        currentGroup = item.kumpulan;
                    }
                    let opt = document.createElement('option');
                    opt.value = item.kategori;
                    opt.innerHTML = "&nbsp;&nbsp;&nbsp;&raquo; " + item.kategori; // Indentasi ke kanan
                    opt.style.color = "#333";
                    groupElement.appendChild(opt);
                });
            })
            .catch(err => { document.getElementById('status').innerHTML = "Gagal memuatkan kategori."; });
    };

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        const payload = {
            tarikh: document.getElementById('tarikh').value,
            perkara: document.getElementById('perkara').value,
            kategori: document.getElementById('kategori').value,
            jumlah: document.getElementById('jumlah').value
        };
        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.text())
        .then(() => {
            document.getElementById('status').innerHTML = "✅ Berjaya!";
            document.getElementById('expenseForm').reset();
            document.getElementById('tarikh').valueAsDate = new Date();
            btn.disabled = false;
        }).catch(() => { btn.disabled = false; });
    });
</script>
</body>
</html>
