<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-btn.active { color: #2563eb; }
        .nav-btn.active svg { fill: #2563eb; }
    </style>
</head>
<body class="bg-gray-50 pb-24">

    <div class="max-w-md mx-auto p-6">
        
        <div id="page-summary" class="tab-content active animate-fade-in">
            <header class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
                <p class="text-sm text-gray-500 font-medium">Ringkasan Kewangan Anda</p>
            </header>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white border border-gray-100 p-5 rounded-3xl shadow-sm">
                    <p class="text-[10px] uppercase tracking-wider font-bold text-gray-400 mb-2">Total Gaji</p>
                    <h2 id="sum-gaji" class="text-xl font-bold text-blue-600 font-mono">RM 0.00</h2>
                </div>
                <div class="bg-white border border-gray-100 p-5 rounded-3xl shadow-sm">
                    <p class="text-[10px] uppercase tracking-wider font-bold text-gray-400 mb-2">Simpanan</p>
                    <h2 id="sum-simpanan" class="text-xl font-bold text-green-600 font-mono">RM 0.00</h2>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-6">
                <h3 class="text-sm font-bold text-gray-700 mb-4 uppercase tracking-widest text-center">Analisis Aliran</h3>
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div id="page-input" class="tab-content">
            <header class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Tambah Data</h1>
                <p class="text-sm text-gray-500 font-medium">Masukkan transaksi baru</p>
            </header>

            <form id="entryForm" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Nama Perkara</label>
                    <input type="text" id="itemName" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="cth: Gaji Disember" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Kategori (Tab 01)</label>
                    <select id="itemCat" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none appearance-none">
                        </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Jumlah (RM)</label>
                    <input type="number" step="0.01" id="itemAmt" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0.00" required>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 active:scale-95 transition-all">
                    Simpan Transaksi
                </button>
            </form>
        </div>

        <div id="page-history" class="tab-content">
            <header class="flex justify-between items-end mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">History</h1>
                    <p class="text-sm text-gray-500 font-medium">Semua rekod Tab 02</p>
                </div>
                <a href="https://docs.google.com/spreadsheets/d/11FpenLRTpP95MCIKwaz3uG9FrR6r-0zW-jK-x1V6P5E/edit" target="_blank" class="text-[10px] bg-red-50 text-red-600 px-4 py-2 rounded-full font-bold uppercase tracking-tight">
                    Padam Data ↗
                </a>
            </header>
            <div id="history-list" class="space-y-4">
                </div>
        </div>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-gray-100 flex justify-around py-4 max-w-md mx-auto shadow-xl rounded-t-3xl">
        <button onclick="showPage('summary', this)" class="nav-btn active flex flex-col items-center flex-1">
            <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            <span class="text-[10px] font-bold">DASHBOARD</span>
        </button>
        <button onclick="showPage('input', this)" class="nav-btn text-gray-300 flex flex-col items-center flex-1">
            <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span class="text-[10px] font-bold">KEY-IN</span>
        </button>
        <button onclick="showPage('history', this)" class="nav-btn text-gray-300 flex flex-col items-center flex-1">
            <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            <span class="text-[10px] font-bold">HISTORY</span>
        </button>
    </nav>

    <script>
        // PAUTAN DATA ANDA
        const csvDropdown = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKoViIImo84Y46xFVekhPH5e-_m0gGQ1lXWPbVoQx3VETGKGDjWe7pdTYX-8zmkRIYeUcvfXDgYJVR/pub?gid=736450696&single=true&output=csv';
        const csvData = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKoViIImo84Y46xFVekhPH5e-_m0gGQ1lXWPbVoQx3VETGKGDjWe7pdTYX-8zmkRIYeUcvfXDgYJVR/pub?gid=2125214790&single=true&output=csv';
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbxySlGFp9EYZKHsq_1FnoE17ubTRbhrBTmaFgyWgRCsQtdrApyX8ppAMJ91whqQJ8MF/exec'; 

        let myChart;

        function showPage(id, btn) {
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-blue-600'));
            document.getElementById('page-' + id).classList.add('active');
            btn.classList.add('active');
        }

        async function initApp() {
            try {
                // 1. Load Dropdown (Tab 01)
                const res1 = await fetch(csvDropdown);
                const text1 = await res1.text();
                const rows1 = text1.split('\n').slice(1);
                let optHtml = '';
                rows1.forEach(row => {
                    const val = row.split(',')[0].replace(/"/g,'').trim();
                    if(val) optHtml += `<option value="${val}">${val}</option>`;
                });
                document.getElementById('itemCat').innerHTML = optHtml;

                // 2. Load Data & Dashboard (Tab 02)
                const res2 = await fetch(csvData);
                const text2 = await res2.text();
                const rows2 = text2.split('\n').slice(1);
                
                let gaji = 0, simpanan = 0, historyHtml = '';

                rows2.forEach(row => {
                    const cols = row.split(',');
                    if(cols.length < 5) return;
                    const tkh = cols[1];
                    const nama = cols[2].replace(/"/g,'');
                    const kat = cols[3].replace(/"/g,'').trim();
                    const amt = parseFloat(cols[4]);

                    if(!isNaN(amt)) {
                        if(kat === 'Gaji') gaji += amt;
                        if(kat === 'Simpanan') simpanan += amt;

                        historyHtml += `
                            <div class="bg-white p-5 rounded-3xl border border-gray-100 flex justify-between items-center shadow-sm">
                                <div>
                                    <p class="font-bold text-gray-800 text-sm mb-1">${nama}</p>
                                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">${tkh} • ${kat}</p>
                                </div>
                                <div class="text-right">
                                    <p class="font-bold ${kat==='Gaji'?'text-blue-600':'text-green-600'} text-sm">RM ${amt.toFixed(2)}</p>
                                </div>
                            </div>`;
                    }
                });

                document.getElementById('sum-gaji').innerText = `RM ${gaji.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                document.getElementById('sum-simpanan').innerText = `RM ${simpanan.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                document.getElementById('history-list').innerHTML = historyHtml || '<p class="text-center text-gray-300 py-10 text-xs font-bold uppercase tracking-widest">Tiada rekod</p>';
                
                renderChart(gaji, simpanan);
            } catch (err) { console.error("Error loading:", err); }
        }

        function renderChart(g, s) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Gaji', 'Simpanan'],
                    datasets: [{
                        data: [g, s],
                        backgroundColor: ['#2563eb', '#22c55e'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    cutout: '75%',
                    plugins: { legend: { position: 'bottom', labels: { font: { weight: 'bold', size: 10 } } } }
                }
            });
        }

        document.getElementById('entryForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            const payload = {
                itemName: document.getElementById('itemName').value,
                category: document.getElementById('itemCat').value,
                amount: document.getElementById('itemAmt').value
            };

            try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
                alert('Berjaya Disimpan!');
                e.target.reset();
                initApp();
                showPage('summary', document.querySelector('.nav-btn'));
            } catch (err) { alert('Ralat penghantaran data'); }
            finally { btn.disabled = false; btn.innerText = 'Simpan Transaksi'; }
        };

        window.onload = initApp;
    </script>
</body>
</html>
