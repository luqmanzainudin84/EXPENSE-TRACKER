<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Kewangan Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; margin-bottom: 20px; border-top: 5px solid var(--primary); }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1.5px solid #eee; font-size: 15px; box-sizing: border-box; }
        optgroup { font-weight: bold; text-transform: uppercase; }
        /* Warna Dropdown */
        optgroup[label*="GAJI"] { color: #27ae60; }
        optgroup[label*="OTHER"] { color: #2980b9; }
        optgroup[label*="KEPERLUAN"] { color: #e67e22; }
        optgroup[label*="GAYA HIDUP"] { color: #9b59b6; }
        optgroup[label*="KEWANGAN"] { color: #e74c3c; }
        
        button { background: var(--primary); color: white; font-weight: bold; cursor: pointer; border: none; }
        .chart-box { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 420px; margin-bottom: 20px; text-align: center; }
        .log-box { width: 100%; max-width: 420px; background: white; border-radius: 15px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px; border-bottom: 2px solid #eee; color: #95a5a6; }
        td { padding: 10px; border-bottom: 1px solid #f9f9f9; }
        .neg { color: #e74c3c; font-weight: bold; }
        .pos { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="text-align:center">💰 Tracker Kewangan</h2>
        <form id="trackerForm">
            <input type="date" id="tarikh" required>
            <input type="text" id="perkara" placeholder="Contoh: Makan Tengahari" required>
            <select id="kategori" required><option value="">Memuatkan...</option></select>
            <input type="number" step="0.01" id="jumlah" placeholder="Jumlah RM" required>
            <button type="submit" id="submitBtn">SIMPAN REKOD</button>
        </form>
        <div id="statusMsg" style="text-align:center; font-size: 13px;"></div>
    </div>

    <div class="chart-box">
        <h3>📊 Analisis Belanja (%)</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <div class="log-box">
        <h3 style="text-align:center">📜 Log Transaksi</h3>
        <table id="logTable">
            <thead><tr><th>Tarikh</th><th>Perkara</th><th>RM</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaBXLbZhzQXAjaWgKmE7WsVXE867PZ1A9l84sV9Dba2ACsnApJQW7cofKDqTlG3Lu9/exec";
    let chart;

    window.onload = () => {
        document.getElementById('tarikh').valueAsDate = new Date();
        fetchData();
    };

    function fetchData() {
        fetch(SCRIPT_URL).then(r => r.json()).then(res => {
            // Populate Categories
            const sel = document.getElementById('kategori');
            sel.innerHTML = '<option value="">-- Pilih Kategori --</option>';
            const gps = res.categories.reduce((a, b) => { (a[b.kumpulan] = a[b.kumpulan] || []).push(b.kategori); return a; }, {});
            for (let g in gps) {
                let grp = document.createElement('optgroup'); grp.label = g;
                gps[g].forEach(c => { let o = document.createElement('option'); o.value = o.text = c; grp.appendChild(o); });
                sel.add(grp);
            }
            // Update UI
            updateUI(res.logs);
        });
    }

    function updateUI(logs) {
        const tbody = document.querySelector('#logTable tbody');
        tbody.innerHTML = '';
        const chartData = {};

        logs.forEach(l => {
            let d = new Date(l.tarikh).toLocaleDateString('ms-MY', {day:'2-digit', month:'2-digit'});
            tbody.innerHTML += `<tr><td>${d}</td><td>${l.perkara}<br><small style="color:#bdc3c7">${l.kategori}</small></td><td class="${l.jumlah < 0 ? 'neg' : 'pos'}">${l.jumlah.toFixed(2)}</td></tr>`;
            if (l.jumlah < 0) chartData[l.kategori] = (chartData[l.kategori] || 0) + Math.abs(l.jumlah);
        });

        const ctx = document.getElementById('pieChart').getContext('2d');
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: Object.keys(chartData),
                datasets: [{ data: Object.values(chartData), backgroundColor: ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22'] }]
            },
            options: { 
                plugins: { 
                    legend: { position: 'bottom' },
                    tooltip: { callbacks: { label: (c) => {
                        let sum = c.dataset.data.reduce((a, b) => a + b, 0);
                        let p = (c.raw * 100 / sum).toFixed(1) + "%";
                        return `${c.label}: RM${c.raw.toFixed(2)} (${p})`;
                    }}}
                }
            }
        });
    }

    document.getElementById('trackerForm').onsubmit = (e) => {
        e.preventDefault();
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('statusMsg').innerText = "⏳ Menyimpan...";
        
        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({
            tarikh: document.getElementById('tarikh').value,
            perkara: document.getElementById('perkara').value,
            kategori: document.getElementById('kategori').value,
            jumlah: document.getElementById('jumlah').value
        })}).then(() => {
            document.getElementById('statusMsg').innerText = "✅ Berjaya!";
            document.getElementById('trackerForm').reset();
            document.getElementById('tarikh').valueAsDate = new Date();
            document.getElementById('submitBtn').disabled = false;
            fetchData();
        });
    };
</script>
</body>
</html>
