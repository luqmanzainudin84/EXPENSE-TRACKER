<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 pb-24">

    <div class="max-w-md mx-auto p-5">
        <div class="bg-white p-5 rounded-2xl shadow-sm border mb-6">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Tambah Transaksi</h2>
            <form id="expense-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Nama Barang/Perkara</label>
                    <input type="text" id="itemName" class="w-full p-2 border rounded-lg" placeholder="Contoh: Beli Ayam" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Kategori</label>
                        <select id="category" class="w-full p-2 border rounded-lg">
                            <option value="Gaji">Gaji</option>
                            <option value="Simpanan">Simpanan</option>
                            <option value="Belanja">Belanja</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Jumlah (RM)</label>
                        <input type="number" id="amount" class="w-full p-2 border rounded-lg" placeholder="0.00" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition">
                    Simpan Transaksi
                </button>
            </form>
        </div>

        <hr class="mb-6">

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                <p class="text-[10px] uppercase font-bold text-blue-400">Total Gaji</p>
                <h2 id="total-gaji" class="text-lg font-bold text-blue-700">RM 0</h2>
            </div>
            <div class="bg-green-50 p-4 rounded-2xl border border-green-100">
                <p class="text-[10px] uppercase font-bold text-green-400">Simpanan</p>
                <h2 id="total-simpanan" class="text-lg font-bold text-green-700">RM 0</h2>
            </div>
        </div>

        <h3 class="text-sm font-bold text-gray-800 mb-4">Transaksi Terkini</h3>
        <div id="transaction-list" class="space-y-3">
            <p class="text-center text-gray-400 text-xs">Memuatkan data...</p>
        </div>
    </div>

    <script>
        // Ganti dengan URL Google Apps Script Web App anda yang asal (untuk simpan data)
        const scriptUrl = 'SILAKAN_MASUKKAN_URL_SCRIPT_ANDA_DI_SINI'; 
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKoViIImo84Y46xFVekhPH5e-_m0gGQ1lXWPbVoQx3VETGKGDjWe7pdTYX-8zmkRIYeUcvfXDgYJVR/pub?output=csv';

        // FUNGSI SIMPAN DATA (Input)
        document.getElementById('expense-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            const data = {
                itemName: document.getElementById('itemName').value,
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value
            };

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                alert('Data berjaya disimpan!');
                location.reload(); // Refresh untuk nampak data baru
            }).catch(err => {
                alert('Ralat simpan data');
                console.error(err);
                btn.disabled = false;
                btn.innerText = 'Simpan Transaksi';
            });
        });

        // FUNGSI TARIK DATA (Dashboard)
        async function fetchData() {
            try {
                const response = await fetch(csvUrl);
                const csvData = await response.text();
                const rows = csvData.split('\n').slice(1);

                let gaji = 0; let simpanan = 0; let listHtml = '';

                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length < 5) return;

                    const nama = cols[2].replace(/"/g, '');
                    const kat = cols[3].replace(/"/g, '').trim();
                    const amaun = parseFloat(cols[4]);
                    const tarikh = cols[1];

                    if (kat === 'Gaji') gaji += amaun;
                    if (kat === 'Simpanan') simpanan += amaun;

                    listHtml += `
                        <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                            <div>
                                <p class="text-sm font-bold text-gray-800">${nama}</p>
                                <p class="text-[10px] text-gray-400">${tarikh}</p>
                            </div>
                            <p class="text-sm font-bold ${kat === 'Gaji' ? 'text-blue-600' : 'text-green-600'}">RM ${amaun}</p>
                        </div>
                    `;
                });

                document.getElementById('total-gaji').innerText = `RM ${gaji}`;
                document.getElementById('total-simpanan').innerText = `RM ${simpanan}`;
                document.getElementById('transaction-list').innerHTML = listHtml;
            } catch (e) { console.error(e); }
        }

        fetchData();
    </script>
</body>
</html>
