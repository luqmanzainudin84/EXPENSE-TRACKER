<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Kewangan Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        /* Warna Dropdown ikut Kumpulan */
        optgroup[label*="GAJI"] { color: #27ae60; }
        optgroup[label*="KEPERLUAN"] { color: #e67e22; }
        optgroup[label*="GAYA HIDUP"] { color: #9b59b6; }
        .chart-container { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; font-size: 12px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align:center">💰 Tracker Kewangan</h2>
        <form id="expForm">
            <input type="date" id="tgl" required>
            <input type="text" id="item" placeholder="Perkara" required>
            <select id="kat" required><option>Memuatkan kategori...</option></select>
            <input type="number" id="amt" placeholder="RM 0.00" required>
            <button type="submit" id="btn">SIMPAN REKOD</button>
        </form>
    </div>

    <div class="chart-container">
        <h3 style="text-align:center">📊 Analisis Belanja (%)</h3>
        <canvas id="myChart"></canvas>
    </div>

    <div style="width:100%; max-width: 400px;">
        <h3 style="text-align:center">📜 Log Transaksi</h3>
        <table id="logTable">
            <thead><tr><th>Tarikh</th><th>Perkara</th><th>RM</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby7pzFQaCwj0hEfl2JMtENZkVpmu_jSjF85m8iaCwY3IYDQCfeM6S761Ah9LgxSkZcDSw/exec";
    let chart;

    window.onload = () => { 
        document.getElementById('tgl').valueAsDate = new Date();
        muatData(); 
    };

    function muatData() {
        fetch(WEB_APP_URL).then(r => r.json()).then(res => {
            const sel = document.getElementById('kat');
            sel.innerHTML = '<option value="">-- Pilih Kategori --</option>';
            // Grouping categories
            const gps = res.categories.reduce((a, b) => { (a[b.kumpulan] = a[b.kumpulan] || []).push(b.kategori); return a; }, {});
            for (let g in gps) {
                let grp = document.createElement('optgroup'); grp.label = g;
                gps[g].forEach(c => { let o = document.createElement('option'); o.value = c; o.text = c; grp.appendChild(o); });
                sel.add(grp);
            }
            updateUI(res.logs);
        });
    }

    function updateUI(logs) {
        const tb = document.querySelector('#logTable tbody');
        tb.innerHTML = '';
        const cData = {};
        logs.forEach(l => {
            tb.innerHTML += `<tr><td>${new Date(l.tarikh).toLocaleDateString('ms-MY')}</td><td>${l.perkara}</td><td>${l.jumlah.toFixed(2)}</td></tr>`;
            if(l.jumlah < 0) cData[l.kategori] = (cData[l.kategori] || 0) + Math.abs(l.jumlah);
        });
        renderChart(cData);
    }

    function renderChart(data) {
        const ctx = document.getElementById('myChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: Object.keys(data),
                datasets: [{ data: Object.values(data), backgroundColor: ['#e74c3c','#3498db','#f1c40f','#2ecc71','#9b59b6'] }]
            },
            options: {
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: (c) => {
                                let total = c.dataset.data.reduce((a,b) => a+b, 0);
                                let perc = (c.raw * 100 / total).toFixed(1) + "%";
                                return `${c.label}: RM${c.raw.toFixed(2)} (${perc})`;
                            }
                        }
                    }
                }
            }
        });
    }

    document.getElementById('expForm').onsubmit = (e) => {
        e.preventDefault();
        document.getElementById('btn').disabled = true;
        fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({
            tarikh: document.getElementById('tgl').value,
            perkara: document.getElementById('item').value,
            kategori: document.getElementById('kat').value,
            jumlah: document.getElementById('amt').value
        })}).then(() => { 
            document.getElementById('expForm').reset(); 
            document.getElementById('btn').disabled = false;
            muatData(); 
        });
    };
</script>
</body>
</html>
