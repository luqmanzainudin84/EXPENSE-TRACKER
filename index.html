<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .nav-btn.active { color: #2563eb; }
        .nav-btn.active svg { fill: #2563eb; }
    </style>
</head>
<body class="pb-28">

    <div class="max-w-md mx-auto p-6">
        
        <div id="page-summary" class="tab-content active">
            <header class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
                <p class="text-sm text-gray-500 font-medium">Status kewangan terkini</p>
            </header>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-gradient-to-br from-blue-600 to-blue-700 p-5 rounded-3xl shadow-lg shadow-blue-100">
                    <p class="text-[10px] uppercase tracking-widest font-bold text-blue-100 mb-2 opacity-80">Total Gaji</p>
                    <h2 id="sum-gaji" class="text-xl font-bold text-white font-mono text-white">RM 0.00</h2>
                </div>
                <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 p-5 rounded-3xl shadow-lg shadow-emerald-100">
                    <p class="text-[10px] uppercase tracking-widest font-bold text-emerald-100 mb-2 opacity-80">Simpanan</p>
                    <h2 id="sum-simpanan" class="text-xl font-bold text-white font-mono text-white">RM 0.00</h2>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div id="page-input" class="tab-content">
            <header class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Tambah Data</h1>
                <p class="text-sm text-gray-500 font-medium">Pilih kategori dari tab rujukan</p>
            </header>

            <form id="entryForm" class="bg-white p-7 rounded-[2.5rem] shadow-sm border border-gray-100 space-y-6">
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase mb-2 ml-1">Nama Perkara</label>
                    <input type="text" id="itemName" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="cth: Gaji Jan" required>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase mb-2 ml-1">Kategori (ExpenseTracker01)</label>
                    <select id="itemCat" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Memuatkan senarai...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase mb-2 ml-1">Jumlah (RM)</label>
                    <input type="number" step="0.01" id="itemAmt" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-mono" placeholder="0.00" required>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-100 active:scale-95 transition-all">
                    Simpan Transaksi
                </button>
            </form>
        </div>

        <div id="page-history" class="tab-content">
            <header class="flex justify-between items-end mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Sejarah</h1>
                    <p class="text-sm text-gray-500 font-medium">Rekod dalam tab 02</p>
                </div>
                <a href="https://docs.google.com/spreadsheets/d/11FpenLRTpP95MCIKwaz3uG9FrR6r-0zW-jK-x1V6P5E/edit" target="_blank" class="text-[10px] bg-red-50 text-red-500 px-4 py-2 rounded-full font-bold uppercase tracking-tight shadow-sm border border-red-100">
                    Edit di Sheets ↗
                </a>
            </header>
            <div id="history-list" class="space-y-4"></div>
        </div>

    </div>

    <nav class="fixed bottom-8 left-6 right-6 bg-white/90 backdrop-blur-xl border border-white/20 flex justify-around py-4 max-w-md mx-auto shadow-2xl rounded-[2rem]">
        <button onclick="showPage('summary', this)" class="nav-btn active flex flex-col items-center flex-1">
            <svg class="w-5 h-5 mb-1" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            <span class="text-[10px] font-bold tracking-tighter">DASHBOARD</span>
        </button>
        <button onclick="showPage('input', this)" class="nav-btn text-gray-300 flex flex-col items-center flex-1">
            <svg class="w-5 h-5 mb-1" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span class="text-[10px] font-bold tracking-tighter">KEY-IN</span>
        </button>
        <button onclick="showPage('history', this)" class="nav-btn text-gray-300 flex flex-col items-center flex-1">
            <svg class="w-5 h-5 mb-1" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            <span class="text-[10px] font-bold tracking-tighter">HISTORY</span>
        </button>
    </nav>

    <script>
        const csvDropdown = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKoViIImo84Y46xFVekhPH5e-_m0gGQ1lXWPbVoQx3VETGKGDjWe7pdTYX-8zmkRIYeUcvfXDgYJVR/pub?gid=736450696&single=true&output=csv';
        const csvData = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKoViIImo84Y46xFVekhPH5e-_m0gGQ1lXWPbVoQx3VETGKGDjWe7pdTYX-8zmkRIYeUcvfXDgYJVR/pub?gid=2125214790&single=true&output=csv';
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbxySlGFp9EYZKHsq_1FnoE17ubTRbhrBTmaFgyWgRCsQtdrApyX8ppAMJ91whqQJ8MF/exec'; 

        let myChart;

        function showPage(id, btn) {
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-blue-600'));
            document.getElementById('page-' + id).classList.add('active');
            btn.classList.add('active');
        }

        async function initApp() {
            try {
                // 1. Ambil Dropdown dari ExpenseTracker01
                const res1 = await fetch(csvDropdown);
                const text1 = await res1.text();
                const lines = text1.split('\n').filter(line => line.trim() !== '');
                
                // Ambil unik kategori dari kolum pertama CSV Tab 01
                let categories = new Set();
                lines.slice(1).forEach(line => {
                    const firstCol = line.split(',')[0].replace(/"/g, '').trim();
                    if (firstCol) categories.add(firstCol);
                });

                let optHtml = '<option value="" disabled selected>Pilih Kategori</option>';
                categories.forEach(cat => {
                    optHtml += `<option value="${cat}">${cat}</option>`;
                });
                document.getElementById('itemCat').innerHTML = optHtml;

                // 2. Ambil Data Transaksi dari ExpenseTracker02
                const res2 = await fetch(csvData);
                const text2 = await res2.text();
                const rows2 = text2.split('\n').slice(1);
                
                let gaji = 0, simpanan = 0, historyHtml = '';

                rows2.forEach(row => {
                    const cols = row.split(',');
                    if(cols.length < 5) return;
                    
                    const tkh = cols[1];
                    const nama = cols[2].replace(/"/g,'');
                    const kat = cols[3].replace(/"/g,'').trim();
                    const amt = parseFloat(cols[4]);

                    if(!isNaN(amt)) {
                        if(kat === 'Gaji') gaji += amt;
                        if(kat === 'Simpanan') simpanan += amt;

                        historyHtml += `
                            <div class="bg-white p-5 rounded-[2rem] border border-gray-100 flex justify-between items-center shadow-sm">
                                <div>
                                    <p class="font-bold text-gray-800 text-sm mb-1">${nama}</p>
                                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">${tkh} • ${kat}</p>
                                </div>
                                <p class="font-bold ${kat==='Gaji'?'text-blue-600':'text-emerald-600'} text-sm font-mono">RM ${amt.toFixed(2)}</p>
                            </div>`;
                    }
                });

                document.getElementById('sum-gaji').innerText = `RM ${gaji.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                document.getElementById('sum-simpanan').innerText = `RM ${simpanan.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                document.getElementById('history-list').innerHTML = historyHtml || '<p class="text-center text-gray-300 py-10 text-[10px] font-bold tracking-widest uppercase">Tiada rekod</p>';
                
                renderChart(gaji, simpanan);
            } catch (err) { console.error("Ralat:", err); }
        }

        function renderChart(g, s) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Gaji', 'Simpanan'],
                    datasets: [{
                        data: [g, s],
                        backgroundColor: ['#2563eb', '#10b981'],
                        borderWidth: 6,
                        borderColor: '#ffffff'
                    }]
                },
                options: { cutout: '80%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, font: { weight: 'bold' } } } } }
            });
        }

        document.getElementById('entryForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            const payload = {
                itemName: document.getElementById('itemName').value,
                category: document.getElementById('itemCat').value,
                amount: document.getElementById('itemAmt').value
            };

            try {
                await fetch(scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert('Data berjaya disimpan!');
                e.target.reset();
                initApp();
                showPage('summary', document.querySelector('.nav-btn'));
            } catch (err) { alert('Ralat!'); }
            finally { btn.disabled = false; btn.innerText = 'Simpan Transaksi'; }
        };

        window.onload = initApp;
    </script>
</body>
</html>
