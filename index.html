<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-item.active { color: #2563eb; }
    </style>
</head>
<body class="bg-gray-50 pb-20">

    <div class="max-w-md mx-auto p-5">
        
        <div id="page-summary" class="tab-content active">
            <h1 class="text-2xl font-bold mb-6">Summary</h1>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-blue-600 p-4 rounded-2xl text-white shadow-lg">
                    <p class="text-xs opacity-80">Total Gaji</p>
                    <h2 id="sum-gaji" class="text-xl font-bold">RM 0</h2>
                </div>
                <div class="bg-green-600 p-4 rounded-2xl text-white shadow-lg">
                    <p class="text-xs opacity-80">Simpanan</p>
                    <h2 id="sum-simpanan" class="text-xl font-bold">RM 0</h2>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border">
                <canvas id="chartDoughnut"></canvas>
            </div>
        </div>

        <div id="page-input" class="tab-content">
            <h1 class="text-2xl font-bold mb-6">Tambah Transaksi</h1>
            <form id="entryForm" class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Perkara</label>
                    <input type="text" id="name" class="w-full p-3 bg-gray-50 border rounded-xl" placeholder="Contoh: Makan Tengahari" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Kategori</label>
                    <select id="cat" class="w-full p-3 bg-gray-50 border rounded-xl">
                        <option value="Gaji">Gaji</option>
                        <option value="Simpanan">Simpanan</option>
                        <option value="Belanja">Belanja</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Jumlah (RM)</label>
                    <input type="number" id="amt" class="w-full p-3 bg-gray-50 border rounded-xl" placeholder="0.00" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-blue-200 shadow-lg">Simpan Data</button>
            </form>
        </div>

        <div id="page-history" class="tab-content text-center">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold">History</h1>
                <a href="https://docs.google.com/spreadsheets/d/11FpenLRTpP95MCIKwaz3uG9FrR6r-0zW-jK-x1V6P5E/edit" target="_blank" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold">Edit/Delete di Sheets ↗</a>
            </div>
            <div id="history-list" class="space-y-3 text-left">
                </div>
        </div>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 max-w-md mx-auto shadow-2xl">
        <button onclick="showPage('summary')" class="nav-item flex flex-col items-center active">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"></path></svg>
            <span class="text-[10px]">Summary</span>
        </button>
        <button onclick="showPage('input')" class="nav-item flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd"></path></svg>
            <span class="text-[10px]">Key-In</span>
        </button>
        <button onclick="showPage('history')" class="nav-item flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"></path></svg>
            <span class="text-[10px]">History</span>
        </button>
    </nav>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKoViIImo84Y46xFVekhPH5e-_m0gGQ1lXWPbVoQx3VETGKGDjWe7pdTYX-8zmkRIYeUcvfXDgYJVR/pub?output=csv';
        const scriptUrl = 'MASUKKAN_URL_GOOGLE_APPS_SCRIPT_ANDA';

        function showPage(pageId) {
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active', 'text-blue-600'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            event.currentTarget.classList.add('active', 'text-blue-600');
        }

        async function loadData() {
            const resp = await fetch(csvUrl);
            const data = await resp.text();
            const rows = data.split('\n').slice(1);
            
            let g = 0, s = 0, html = '';
            rows.forEach(row => {
                const c = row.split(',');
                if(c.length < 5) return;
                const nama = c[2], kat = c[3].trim(), amt = parseFloat(c[4]), tkh = c[1];
                
                if(kat === 'Gaji') g += amt;
                if(kat === 'Simpanan') s += amt;

                html += `<div class="bg-white p-3 rounded-xl border flex justify-between">
                    <div><p class="font-bold text-sm">${nama}</p><p class="text-[10px] text-gray-400">${tkh}</p></div>
                    <p class="font-bold ${kat==='Gaji'?'text-blue-600':'text-green-600'}">RM ${amt}</p>
                </div>`;
            });

            document.getElementById('sum-gaji').innerText = `RM ${g}`;
            document.getElementById('sum-simpanan').innerText = `RM ${s}`;
            document.getElementById('history-list').innerHTML = html;
            updateChart(g, s);
        }

        function updateChart(g, s) {
            new Chart(document.getElementById('chartDoughnut'), {
                type: 'doughnut',
                data: { labels: ['Gaji', 'Simpanan'], datasets: [{ data: [g, s], backgroundColor: ['#2563eb', '#16a34a'] }] }
            });
        }

        document.getElementById('entryForm').onsubmit = async (e) => {
            e.preventDefault();
            // Gunakan fetch() ke scriptUrl anda seperti biasa
            alert('Data sedang dihantar ke Google Sheets...');
            // Logik POST anda di sini
        };

        loadData();
    </script>
</body>
</html>
