<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Kewangan</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .home-btn { text-decoration: none; background: white; color: #333; padding: 10px 25px; border-radius: 50px; font-weight: 600; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; margin-bottom: 25px; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #fafafa; }
        optgroup { font-style: normal; font-weight: bold; }
        button { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #219150; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

    <a href="https://luqmanzainudin84.github.io/LUQMAN/" class="home-btn">🏠 HOME</a>

    <div class="container">
        <h2>💰 Tracker Kewangan</h2>
        <form id="expenseForm">
            <div class="form-group">
                <label>📅 Tarikh Transaksi</label>
                <input type="date" id="tarikh" required>
            </div>
            <div class="form-group">
                <label>📝 Nama Barang / Perkara</label>
                <input type="text" id="perkara" placeholder="Contoh: Nasi Lemak" required>
            </div>
            <div class="form-group">
                <label>📂 Kategori</label>
                <select id="kategori" required>
                    <option value="">Memuatkan senarai...</option>
                </select>
            </div>
            <div class="form-group">
                <label>💵 Jumlah (RM)</label>
                <input type="number" step="0.01" id="jumlah" placeholder="0.00" required>
            </div>
            <button type="submit" id="submitBtn">Simpan Rekod</button>
        </form>
        <div id="status"></div>
    </div>

<script>
    // Pautan Web App aktif anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbHylQSobleE3doNMGW9mOEVCHBWDJ4MoXY102dxyrS1uNOm0egfm7upmCGPv-8dRhyA/exec";

    window.onload = function() {
        // Set tarikh automatik hari ini
        document.getElementById('tarikh').valueAsDate = new Date();
        
        // Memuatkan kategori dari tab ExpenseTracker01
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('kategori');
                select.innerHTML = '<option value="">-- Pilih Kategori --</option>';
                let currentGroup = "";
                let groupElement = null;

                data.forEach(item => {
                    // Kelompokkan mengikut Kumpulan dengan warna mengikut Jenis
                    if (item.kumpulan !== currentGroup) {
                        groupElement = document.createElement('optgroup');
                        groupElement.label = "--- " + item.kumpulan.toUpperCase() + " ---";
                        groupElement.style.color = (item.jenis === "Income") ? "#27ae60" : "#e74c3c";
                        select.appendChild(groupElement);
                        currentGroup = item.kumpulan;
                    }
                    // Tambah sub-kategori dengan indentasi
                    let opt = document.createElement('option');
                    opt.value = item.kategori;
                    opt.innerHTML = "&nbsp;&nbsp;&nbsp;&raquo; " + item.kategori;
                    opt.style.color = "#333";
                    groupElement.appendChild(opt);
                });
            })
            .catch(err => {
                document.getElementById('status').innerHTML = "<span style='color:red'>Gagal memuatkan kategori.</span>";
            });
    };

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        status.innerHTML = "Menyimpan data...";

        const payload = {
            tarikh: document.getElementById('tarikh').value,
            perkara: document.getElementById('perkara').value,
            kategori: document.getElementById('kategori').value,
            jumlah: document.getElementById('jumlah').value
        };

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.text())
        .then(() => {
            status.innerHTML = "<span style='color:green'>✅ Berjaya Disimpan ke Tracker02!</span>";
            document.getElementById('expenseForm').reset();
            document.getElementById('tarikh').valueAsDate = new Date();
            btn.disabled = false;
        })
        .catch(err => {
            status.innerHTML = "<span style='color:red'>❌ Ralat Simpan.</span>";
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
